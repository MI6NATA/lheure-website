<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'HEURE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>L'HEURE</h1>
        <p class="menu">☰ </p>
        <p class="login">Log In</p>
        <span class="search-icon">
            <span class="glass"></span>
        </span>
    </header>
    <main>
        <section class="hero">
            <video id="hero-video" autoplay muted loop playsinline>
                <source src="videos/race track 720p.mp4" type="video/mp4">
            </video>
            <h2>TIMELESS</h2>
            <p class="hero-text">A timeless legacy of precison and craftsmanship </p>
        </section>
    <section class="cards"> 
        <div class="card"> 
            <img src="images/rolex iconic model 1 .webp" alt="rolex iconic model 1">
            <h3>ICONIC MODELS</h3>
        </div>
        <div class="card">
            <img src="images/rolex crown 2.jpg" alt="rolex the crown">
           <h3>THE CROWN</h3> 
        </div>
        <div class="card"> 
            <img src="images/rolex vintage 3.jpg" alt="rolex heritage">
            <h3>HERITAGE</h3>
        </div>
        <div class="card"> 
            <img src="images/rolex craft 4.webp" alt="rolex craftsmanship">
            <h3>CRAFTSMANSHIP</h3>
        </div>
    </section>
     </main>
     <script src="script.js"></script>
</body>
</html>
